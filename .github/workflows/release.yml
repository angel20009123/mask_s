name: Build versioned Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version tag
        shell: pwsh
        run: |
          $expected = python -c "from version import __version__; print('v' + __version__)"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Version tag must equal $expected" }
      - name: Test calculations
        run: python -m unittest -v
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Build Windows client
        run: python build.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/MaskStudio-*.exe --verify-tag --title "Mask Studio $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
